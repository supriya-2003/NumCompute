[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "1.0.0"
description = "A modular, NumPy-only machine-learning toolkit: I/O, preprocessing, sorting, ranking, statistics, metrics, finite-difference optimisation and pipelines."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]
keywords = ["numpy", "machine-learning", "preprocessing", "statistics", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "matplotlib"]

[tool.setuptools]
packages = ["numcompute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
